services:
  - type: web
    name: jatai-food-backend
    env: node
    region: oregon
    plan: starter  # Mudado de free para starter ($7/mês) para suportar disk
    buildCommand: npm install
    startCommand: node whatsapp-server.js
    healthCheckPath: /health
    disk:
      name: whatsapp-sessions
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_PATH
        value: /var/data/wwebjs_auth
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
